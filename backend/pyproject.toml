[project]
name = "gridmind-backend"
version = "0.1.0"
description = "GridMind — AI-powered F1 race analyst backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.16",
    "psycopg[binary]>=3.3",
    "httpx>=0.28",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Our own deprecations are errors; third-party ones we cannot fix are not.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "default::DeprecationWarning:starlette.*",
    "default::DeprecationWarning:anyio.*",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
